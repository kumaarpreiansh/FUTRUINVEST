# Strategic asset allocation policy — goal-type x horizon x risk band.
#
# These are POLICY defaults chosen by the investment committee, not regulatory
# requirements and not predictions. They are starting points that the portfolio
# engine adjusts for goal proximity and for the investor's binding risk band.

ruleset:
  id: "allocation.policy"
  version: "1.0.0"
  published_on: "2026-08-25"
  owner: "investment-committee"
  review_cadence_days: 180

# Long-run assumptions used ONLY for scenario ranges. Never presented as
# expected or promised returns. Expressed as nominal annual %, pre-tax.
capital_market_assumptions:
  basis: "Long-run historical observation for Indian asset classes, deliberately conservative."
  verification_status: "COMMITTEE_ASSUMPTION"
  legal_review_required: false
  disclosure: "DISC-PROJECTION-001"
  classes:
    EQUITY_LARGE:   {conservative: 7.0,  base: 10.5, optimistic: 13.5, volatility: 16.0}
    EQUITY_FLEXI:   {conservative: 7.0,  base: 11.0, optimistic: 14.5, volatility: 17.0}
    EQUITY_MID:     {conservative: 6.0,  base: 11.5, optimistic: 16.0, volatility: 21.0}
    EQUITY_SMALL:   {conservative: 4.0,  base: 12.0, optimistic: 18.0, volatility: 26.0}
    EQUITY_INTL:    {conservative: 5.0,  base: 9.0,  optimistic: 12.5, volatility: 18.0}
    DEBT_SHORT:     {conservative: 5.5,  base: 6.8,  optimistic: 7.8,  volatility: 2.0}
    DEBT_MEDIUM:    {conservative: 5.5,  base: 7.2,  optimistic: 8.8,  volatility: 4.5}
    GOLD:           {conservative: 3.0,  base: 7.5,  optimistic: 12.0, volatility: 15.0}
    CASH:           {conservative: 4.0,  base: 5.5,  optimistic: 6.5,  volatility: 0.5}
  inflation:
    conservative: 7.0
    base: 6.0
    optimistic: 4.5
  correlation_note: >
    Portfolio volatility is computed with a documented correlation matrix, not
    by summing asset volatilities. See scenarios.py.

correlations:
  EQUITY_LARGE:  {EQUITY_LARGE: 1.00, EQUITY_FLEXI: 0.97, EQUITY_MID: 0.88, EQUITY_SMALL: 0.82, EQUITY_INTL: 0.35, DEBT_SHORT: 0.05, DEBT_MEDIUM: 0.10, GOLD: -0.05, CASH: 0.0}
  EQUITY_FLEXI:  {EQUITY_FLEXI: 1.00, EQUITY_MID: 0.92, EQUITY_SMALL: 0.87, EQUITY_INTL: 0.35, DEBT_SHORT: 0.05, DEBT_MEDIUM: 0.10, GOLD: -0.05, CASH: 0.0}
  EQUITY_MID:    {EQUITY_MID: 1.00, EQUITY_SMALL: 0.93, EQUITY_INTL: 0.30, DEBT_SHORT: 0.03, DEBT_MEDIUM: 0.08, GOLD: -0.05, CASH: 0.0}
  EQUITY_SMALL:  {EQUITY_SMALL: 1.00, EQUITY_INTL: 0.28, DEBT_SHORT: 0.02, DEBT_MEDIUM: 0.06, GOLD: -0.05, CASH: 0.0}
  EQUITY_INTL:   {EQUITY_INTL: 1.00, DEBT_SHORT: 0.05, DEBT_MEDIUM: 0.10, GOLD: 0.10, CASH: 0.0}
  DEBT_SHORT:    {DEBT_SHORT: 1.00, DEBT_MEDIUM: 0.75, GOLD: 0.05, CASH: 0.30}
  DEBT_MEDIUM:   {DEBT_MEDIUM: 1.00, GOLD: 0.08, CASH: 0.20}
  GOLD:          {GOLD: 1.00, CASH: 0.0}
  CASH:          {CASH: 1.00}

# Sleeves: core / growth / stability / diversifier. Not every goal gets all four.
policies:
  - id: "POL-LONG-EQUITY-GROWTH"
    applies_when: {min_years: 10, risk_band: ["MODERATE", "GROWTH", "AGGRESSIVE"]}
    sleeves:
      core:        {EQUITY_FLEXI: 40, EQUITY_LARGE: 15}
      growth:      {EQUITY_MID: 15, EQUITY_SMALL: 5}
      stability:   {DEBT_MEDIUM: 15}
      diversifier: {GOLD: 10}
  - id: "POL-LONG-EQUITY-CONSERVATIVE"
    applies_when: {min_years: 10, risk_band: ["CONSERVATIVE", "CAUTIOUS"]}
    sleeves:
      core:        {EQUITY_LARGE: 30, EQUITY_FLEXI: 15}
      growth:      {}
      stability:   {DEBT_MEDIUM: 35, DEBT_SHORT: 10}
      diversifier: {GOLD: 10}
  - id: "POL-MEDIUM-BALANCED"
    applies_when: {min_years: 5, max_years: 10, risk_band: ["MODERATE", "GROWTH", "AGGRESSIVE"]}
    sleeves:
      core:        {EQUITY_FLEXI: 35, EQUITY_LARGE: 10}
      growth:      {EQUITY_MID: 5}
      stability:   {DEBT_MEDIUM: 35}
      diversifier: {GOLD: 15}
  - id: "POL-MEDIUM-CONSERVATIVE"
    applies_when: {min_years: 5, max_years: 10, risk_band: ["CONSERVATIVE", "CAUTIOUS"]}
    sleeves:
      core:        {EQUITY_LARGE: 25}
      growth:      {}
      stability:   {DEBT_MEDIUM: 45, DEBT_SHORT: 20}
      diversifier: {GOLD: 10}
  - id: "POL-SHORT"
    applies_when: {min_years: 3, max_years: 5}
    sleeves:
      core:        {EQUITY_LARGE: 20}
      growth:      {}
      stability:   {DEBT_SHORT: 60, DEBT_MEDIUM: 15}
      diversifier: {GOLD: 5}
  - id: "POL-VERY-SHORT"
    applies_when: {max_years: 3}
    sleeves:
      core:        {}
      growth:      {}
      stability:   {DEBT_SHORT: 85, CASH: 15}
      diversifier: {}
    note: "Equity is not an appropriate vehicle for money needed inside three years."
  - id: "POL-EMERGENCY"
    applies_when: {goal_type: "EMERGENCY_FUND"}
    sleeves:
      core:        {}
      growth:      {}
      stability:   {CASH: 40, DEBT_SHORT: 60}
      diversifier: {}
    note: "Liquidity and capital stability dominate; return is irrelevant here."

# Glide path: as a goal approaches, de-risk on a schedule the investor can see
# in advance, rather than reacting to markets.
glide_path:
  enabled: true
  start_years_before_goal: 5
  target_equity_pct_at_goal: 10
  steps_per_year: 2
  method: "LINEAR_TO_TARGET"

# Rebalancing policy — bands, not calendar-only, to reduce needless churn.
rebalancing:
  method: "TOLERANCE_BAND"
  absolute_band_pct: 5          # trigger when a sleeve is 5pp off target
  relative_band_pct: 25         # or 25% of its own target weight, whichever is tighter
  min_months_between_rebalances: 6
  prefer_cashflow_rebalancing: true   # redirect SIPs before selling anything
  cashflow_rebalance_max_months: 12   # if drift not closed in 12m, consider a sale
  taxable_sale_requires:
    - "drift exceeds 1.5x the band"
    - "net-of-tax benefit is positive"
    - "goal is inside the glide path"

# Portfolio hygiene limits.
limits:
  max_funds_per_goal: 5
  max_funds_total: 12
  min_allocation_per_fund_pct: 5     # below this a holding adds admin, not diversification
  max_single_fund_pct: 40
  max_single_amc_pct: 35
  max_sector_pct: 30
  max_portfolio_overlap_pct: 40      # between any two equity funds
  max_smallcap_pct_of_equity: 25
