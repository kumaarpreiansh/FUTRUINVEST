# Committee roster. Each role maps to agents/<role>/PROMPT.md.
# The bull and bear researchers call Claude (llm section below) when an
# ANTHROPIC_API_KEY is set in .env; every role falls back to a
# deterministic rule-based stand-in so the pipeline works offline.

llm:
  model: "claude-opus-4-8"
  roles: [bull, bear]   # roles wired to real LLM calls

roles:
  - researcher
  - fundamental
  - technical
  - news
  - sentiment
  - bull
  - bear
  - debate
  - strategy
  - backtest
  - risk
  - verdict
